<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — IPPC Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <p class="login-badge">ADMIN ACCESS</p>
      <h1>Admin Login</h1>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <div class="field-input"><input type="email" id="email" placeholder="admin@example.com" autocomplete="email" required /></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="field-input"><input type="password" id="password" placeholder="Your password" autocomplete="current-password" required /></div>
        </div>
        <p id="error-text" class="error-text" style="display:none;"></p>
        <button type="submit" class="btn-primary" id="login-btn">Login</button>
      </form>
      <p class="login-footnote">Only administrators can access this portal</p>
      <p class="portal-switch"><a href="index.html">User login</a></p>
    </div>
    <footer class="site-footer">© DMENS TECH | 2026</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin-auth.js"></script>
</body>
</html>
