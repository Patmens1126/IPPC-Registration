<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Registration — IPPC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 <header class="dashboard-header">
    <div class="brand-lockup">
      <div class="logo-slot" aria-label="IPPC logo">
        <img src="logo.png" alt="IPPC logo" onerror="this.style.display='none'" />
        <span>IPPC</span>
      </div>
      <div>
        <h1>IPPC Registration</h1>
        <p>My Registration</p>
      </div>
    </div>
    <button class="btn-logout" id="logout-btn">Log out</button>
  </header>

  <main class="dashboard-main">
    <section class="summary-grid summary-grid-narrow">
      <div class="summary-card">
        <p class="label">People registered</p>
        <p class="value" id="stat-count">0</p>
      </div>
    </section>

    <!-- Personal registration form -->
    <section class="panel">
      <h2>My Registration</h2>
      <div class="form-grid">
        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Full name" />
        </div>
        <div>
          <label for="contact">Contact</label>
          <input type="text" id="contact" placeholder="Phone or email" />
        </div>
        <div>
          <label for="occupation">Occupation</label>
          <input type="text" id="occupation" placeholder="Occupation" />
        </div>
        <div class="reference-field">
          <label for="reference">Reference <span>(optional)</span></label>
          <input type="text" id="reference" placeholder="Optional reference" autocomplete="off" />
        </div>
        <div>
          <label for="tshirt">T-Shirt Color</label>
          <select id="tshirt">
            <option value="yellow">Yellow</option>
            <option value="blue-black">Blue-Black</option>
            <option value="red">Red</option>
            <option value="white">White</option>
          </select>
        </div>
        <div>
          <label for="tshirt-size">T-Shirt Size</label>
          <select id="tshirt-size" required>
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
            <option value="xl">XL</option>
            <option value="xxl">XXL</option>
            <option value="xxxl">XXXL</option>
          </select>
        </div>
        <div>
          <button class="btn-add" id="add-btn">Register me</button>
        </div>
      </div>
      <p id="form-error" class="error-text" style="display:none; margin-top:14px;"></p>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact</th>
            <th>Occupation</th>
            <th>Reference</th>
            <th>T-Shirt</th>
            <th>Size</th>
            <th>Due (GHS)</th>
          </tr>
        </thead>
        <tbody id="my-registration-body">
          <tr class="empty-row"><td colspan="7">Loading...</td></tr>
        </tbody>
      </table>
    </section>

  </main>

  <footer class="site-footer dashboard-footer">© DMENS TECH | 2026</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="user-dashboard.js"></script>
</body>
</html>
